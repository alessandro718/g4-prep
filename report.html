<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16305a">
<link rel="icon" href="assets/img/favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/img/icon-192.png">
<link rel="stylesheet" href="assets/css/app.css">
<title>学习报告 · G4 备考</title>
</head>
<body data-page="report">
<header class="site-head" id="site-head"></header>

<main>
  <div class="wrap" style="max-width:920px">
    <div id="share-banner"></div>

    <div class="sect-head" style="margin-top:0">
      <div>
        <h2 id="rep-title">学习报告</h2>
        <p id="rep-sub">—</p>
      </div>
      <div class="no-print" style="display:flex;gap:8px">
        <button class="btn sm ghost" id="btn-print">打印 / 存 PDF</button>
        <button class="btn sm" id="btn-share">生成家长链接</button>
      </div>
    </div>

    <div id="rep-body"></div>

    <div class="card no-print" id="share-card" style="margin-top:18px">
      <h3>发给家长看</h3>
      <p style="margin-top:6px">生成一个只读链接：里面只有汇总数据和薄弱项，不包含孩子的每道作答。家长用微信打开就能看，不需要注册。</p>
      <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center">
        <input id="child-name" type="text" maxlength="12" placeholder="孩子的称呼（可选，如：乐乐）"
          style="flex:1;min-width:180px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:14.5px;font-family:inherit;outline:none">
        <button class="btn sm" id="btn-gen">生成并复制链接</button>
      </div>
      <div id="link-out" style="margin-top:12px"></div>
      <div class="hint" style="margin-top:10px">链接长期有效，但内容是「生成那一刻」的快照；数据更新后重新生成一次即可。</div>
    </div>

    <div class="card" style="margin-top:14px">
      <h3>这份报告怎么读</h3>
      <ul class="list" style="margin-top:8px">
        <li><b>看趋势，不看单日</b>：某天低分可能只是题目难，连续 3 天在同一科掉下来才需要干预。</li>
        <li><b>先修「错得最多」的</b>：薄弱技能里最上面的那一项，明天开新题前先重做对应错题。</li>
        <li><b>正确率 60–75% 是正常区间</b>：说明题目有难度，正在长能力；90% 以上可以考虑提速而不是加量。</li>
      </ul>
    </div>
  </div>
</main>

<footer class="site-foot no-print">
  <div class="wrap">
    <div class="fl">© <span id="foot-year"></span> G4 15 天备考 · 题库为自编练习，非校方真题</div>
    <div class="flinks"><a href="index.html">首页</a><a href="plan.html">15 天计划</a><a href="wrong.html">错题本</a></div>
  </div>
</footer>
<nav class="tabbar" id="site-tabbar"></nav>

<script src="assets/js/data.js"></script>
<script src="assets/js/core.js"></script>
<script>
(function () {
  var A = window.App, S = A.S, SUBJ = A.SUBJ;
  var SUBJ_KEYS = ['eng', 'math', 'chi'];
  var params = new URLSearchParams(location.search);
  var sharedCode = params.get('r');
  var shared = sharedCode ? A.decodeReport(sharedCode) : null;
  var readonly = !!shared;

  /* ---------- 组装数据 ---------- */
  var R;
  if (readonly) {
    R = {
      name: shared.n || '',
      days: shared.d || [],
      subj: { eng: [shared.s[0], shared.s[1]], math: [shared.s[2], shared.s[3]], chi: [shared.s[4], shared.s[5]] },
      weak: shared.w || [],
      date: shared.t || ''
    };
    var t0 = shared.d.reduce(function (a, x) { return [a[0] + x[0], a[1] + x[1]]; }, [0, 0]);
    R.ok = t0[0]; R.ans = t0[1];
    R.pct = R.ans ? Math.round(R.ok / R.ans * 100) : 0;
    R.done = R.days.filter(function (x) { return x[1] > 0; }).length;
  } else {
    var t = A.totalStats(), sub = A.subjectStats();
    var days = [];
    for (var i = 1; i <= 15; i++) { var s = A.dayScore(i); days.push([s.ok, s.ans]); }
    var sk = A.skillStats();
    var weak = Object.keys(sk).filter(function (k) { return sk[k].all >= 2; })
      .sort(function (a, b) { return sk[a].ok / sk[a].all - sk[b].ok / sk[b].all; })
      .slice(0, 4)
      .filter(function (k) { return sk[k].ok / sk[k].all < 0.75; })
      .map(function (k) { return k + ' ' + Math.round(sk[k].ok / sk[k].all * 100) + '%'; });
    R = {
      name: S.name || '', days: days,
      subj: { eng: sub.eng, math: sub.math, chi: sub.chi },
      weak: weak, date: A.fmtD(new Date()),
      ok: t.ok, ans: t.ans, pct: t.pct, done: t.done
    };
  }

  document.getElementById('rep-title').textContent = (R.name ? R.name + ' 的' : '') + '学习报告';
  document.getElementById('rep-sub').textContent = readonly
    ? '分享于 ' + R.date + ' · 只读'
    : '数据截至 ' + R.date + ' · 本机记录，' + R.ans + ' 题已作答';

  if (readonly) {
    document.getElementById('share-banner').innerHTML =
      '<div class="card tight" style="margin-bottom:16px;background:#f7f9fd;border-color:#cfd8e6">' +
        '<div style="font-size:13.5px;color:#3d4a5e">这是家长分享给你的只读报告。想看自己的完整记录？<a href="report.html" style="font-weight:600">打开我的报告 →</a></div>' +
      '</div>';
    document.getElementById('btn-share').style.display = 'none';
    document.getElementById('share-card').style.display = 'none';
  }

  /* ---------- 渲染 ---------- */
  var empty = R.ans === 0;
  var html = '';

  // KPI
  var avg = R.pct;
  var best = R.days.reduce(function (a, x, i) { return (x[1] && (!a || x[0] / x[1] > a.r)) ? { r: x[0] / x[1], d: i + 1 } : a; }, null);
  html += '<div class="kpis">' +
    '<div class="kpi"><div class="kn">' + R.done + '<small>/15 天</small></div><div class="kl">已完成天数</div></div>' +
    '<div class="kpi"><div class="kn">' + avg + '<small>%</small></div><div class="kl">累计正确率</div></div>' +
    '<div class="kpi"><div class="kn">' + R.ans + '<small>题</small></div><div class="kl">已作答（共 150 题）</div></div>' +
    '<div class="kpi"><div class="kn">' + (best ? 'D' + best.d : '—') + '</div><div class="kl">' + (best ? '单日最好 ' + Math.round(best.r * 100) + '%' : '暂无记录') + '</div></div>' +
  '</div>';

  if (empty) {
    html += '<div class="card" style="margin-top:16px"><div class="empty" style="padding:34px 10px">' +
      '<div class="big">◎</div>还没有作答记录。<br>做完 Day 1 的 20 道题，这里就会出现正确率、科目分项和薄弱项。' +
      '<div style="margin-top:18px"><a class="btn sm" href="quiz.html">去做今天的题</a></div></div></div>';
    document.getElementById('rep-body').innerHTML = html;
    return;
  }

  // 每日柱状图
  var maxH = 108;
  var cols = R.days.map(function (x, i) {
    var pct = x[1] ? Math.round(x[0] / x[1] * 100) : 0;
    var h = x[1] ? Math.max(4, Math.round(pct / 100 * maxH)) : 3;
    return '<div class="col' + (x[1] ? '' : ' nodata') + '" title="Day ' + (i + 1) + '：' + (x[1] ? pct + '%（' + x[0] + '/' + x[1] + '）' : '未作答') + '">' +
      (x[1] ? '<span style="font-size:9px;color:#8a94a6">' + pct + '</span>' : '') +
      '<div class="cb" style="height:' + h + 'px"></div>' +
      '<div class="cl">' + (i + 1) + '</div></div>';
  }).join('');

  html += '<div class="card" style="margin-top:16px">' +
    '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">' +
      '<h3 style="margin:0">每日正确率</h3><span class="hint">横轴 Day 1–15</span>' +
    '</div>' +
    '<div class="cols">' + cols + '</div>' +
    '<div class="hint" style="margin-top:8px">灰色柱＝当天还没做。看两点：有没有连续下滑，以及 Day 7 / 14 的限时套是否明显低于平时。</div>' +
  '</div>';

  // 三科
  var tabs = SUBJ_KEYS.map(function (k) {
    var v = R.subj[k] || [0, 0];
    var pct = v[1] ? Math.round(v[0] / v[1] * 100) : 0;
    var color = pct >= 80 ? 'green' : pct >= 60 ? '' : 'red';
    return '<div class="subjrow">' +
      '<span class="sn">' + SUBJ[k] + '</span>' +
      '<span class="sb"><span class="bar ' + (pct >= 80 ? 'green' : 'navy') + '"><i style="width:' + pct + '%"></i></span></span>' +
      '<span class="sv"><b>' + pct + '%</b> <span style="color:var(--muted);font-size:12px">' + v[0] + '/' + v[1] + '</span></span>' +
    '</div>';
  }).join('');

  html += '<div class="card" style="margin-top:14px">' +
    '<h3>三科分项</h3>' + tabs +
    '<div class="hint" style="margin-top:6px">正确率低于 60% 的科目，明天优先做该科的错题，不要平均用力。</div>' +
  '</div>';

  // 薄弱技能 + 建议
  var advice = [];
  if (R.weak.length) {
    advice.push('<b>最该先补的</b>：' + R.weak.map(function (w) { return A.esc(w); }).join('、') + '。做法是「同一知识点连做 5 道」，而不是把整套题再刷一遍。');
  }
  var lowest = SUBJ_KEYS.map(function (k) { return { k: k, v: R.subj[k] || [0, 0] }; })
    .filter(function (x) { return x.v[1] >= 3; })
    .sort(function (a, b) { return a.v[0] / a.v[1] - b.v[0] / b.v[1]; })[0];
  if (lowest && lowest.v[0] / lowest.v[1] < 0.7) {
    advice.push('<b>' + SUBJ[lowest.k] + '是当前短板</b>（' + Math.round(lowest.v[0] / lowest.v[1] * 100) + '%）。每天固定先做这一科，做完再看其他科。');
  }
  if (R.done < 5) advice.push('<b>先解决「坚持」</b>：目前只完成 ' + R.done + ' 天。把提醒时间定在每天同一时段，比多加练习题更有效。');
  if (avg >= 85) advice.push('<b>已经比较稳了</b>：不必加量，改用限时（每套 25 分钟）训练做题速度，避免考场上做不完。');
  if (!advice.length) advice.push('继续保持每天一套的节奏，重点看错题本里的重复错误。');

  html += '<div class="grid g2" style="margin-top:14px">' +
    '<div class="card"><h3>薄弱技能</h3>' +
      (R.weak.length
        ? '<ul class="list" style="margin-top:8px">' + R.weak.map(function (w) { return '<li>' + A.esc(w) + '</li>'; }).join('') + '</ul>'
        : '<p style="margin-top:8px;color:var(--muted)">暂无明显短板（各技能正确率均在 75% 以上）。</p>') +
    '</div>' +
    '<div class="card"><h3>给家长的建议</h3>' +
      '<ol class="list" style="margin-top:8px">' + advice.map(function (a) { return '<li>' + a + '</li>'; }).join('') + '</ol>' +
    '</div>' +
  '</div>';

  document.getElementById('rep-body').innerHTML = html;

  /* ---------- 打印 / 分享 ---------- */
  document.getElementById('btn-print').addEventListener('click', function () { window.print(); });

  var nameInput = document.getElementById('child-name');
  if (nameInput) {
    nameInput.value = S.name || '';
    nameInput.addEventListener('change', function () {
      S.name = nameInput.value.trim(); A.save();
      document.getElementById('rep-title').textContent = (S.name ? S.name + ' 的' : '') + '学习报告';
    });
  }

  function buildLink() {
    var code = A.encodeReport();
    return location.origin + location.pathname.replace(/[^/]*$/, '') + 'report.html?r=' + code;
  }
  function showLink(url) {
    document.getElementById('link-out').innerHTML =
      '<div class="share-box">' + A.esc(url) + '</div>' +
      '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">' +
        '<button class="btn sm ghost" id="btn-copy">复制链接</button>' +
        '<a class="btn sm ghost" target="_blank" rel="noopener" href="' + A.esc(url) + '">预览效果</a>' +
      '</div>';
    document.getElementById('btn-copy').addEventListener('click', function () { A.copy(url); });
  }
  document.getElementById('btn-gen').addEventListener('click', function () {
    S.name = (nameInput.value || '').trim(); A.save();
    var url = buildLink();
    showLink(url);
    A.copy(url);
  });
  document.getElementById('btn-share').addEventListener('click', function () {
    var url = buildLink();
    showLink(url);
    if (navigator.share) {
      navigator.share({ title: '学习报告', text: '这是孩子最近 15 天的备考报告：', url: url }).catch(function () { A.copy(url); });
    } else { A.copy(url); }
    document.getElementById('share-card').scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
})();
</script>
</body>
</html>
